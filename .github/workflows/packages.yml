name: GameData packages

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Source commit or branch to package
        required: true
        default: main
  pull_request:
    paths:
      - .github/workflows/packages.yml
      - scripts/package_client.py
      - scripts/licenses/**

permissions:
  contents: read

concurrency:
  group: packages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: Package (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            platform: linux-x64
            target: x86_64-unknown-linux-gnu
            rustflags: ''
          - os: windows-latest
            platform: windows-x64
            target: x86_64-pc-windows-msvc
            rustflags: '-C target-feature=+crt-static'
    runs-on: ${{ matrix.os }}
    env:
      CARGO_INCREMENTAL: 0
      RUSTFLAGS: ${{ matrix.rustflags }}
    steps:
      - uses: actions/checkout@v7
        with:
          path: packaging
      - name: Preserve source and embedded shader line endings
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v7
        with:
          # PR builds package the base revision, never unmerged gameplay changes.
          ref: ${{ inputs.source_ref || github.event.pull_request.base.sha }}
          path: source
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake pkg-config libasound2-dev libwayland-dev libxkbcommon-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: source
          key: packages-${{ matrix.target }}
      - name: Build optimized client and dedicated server
        working-directory: source
        run: cargo build --locked --release --target ${{ matrix.target }} -p jkr-viewer -p jkr-dedicated
      - name: Package and smoke-check extracted executables
        run: >-
          python packaging/scripts/package_client.py
          --source source --target ${{ matrix.target }}
          --platform ${{ matrix.platform }} --output dist --smoke-check
      - uses: actions/upload-artifact@v7
        with:
          name: JKR-${{ matrix.platform }}
          path: dist/*
          if-no-files-found: error
          retention-days: 30
